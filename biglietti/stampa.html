<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Biglietti · file di stampa</title>
<!--
  File di stampa delle due proposte finali (vedi index.html).
  Formato rifilato 85 × 55 mm, abbondanza 3 mm per lato (file 91 × 61 mm).
  ?crocini      → aggiunge 10 mm di margine con i segni di taglio
  ?p=c / ?p=d   → solo la proposta C o D
-->
<style>
@font-face { font-family: 'Instrument Sans'; font-style: normal; font-weight: 400 700; src: url(../fonts/instrument-sans-latin.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Sans'; font-style: italic; font-weight: 400 700; src: url(../fonts/instrument-sans-italic-latin.woff2) format('woff2'); }

:root {
  --bg: #F3F2EC; --ink: #2B2F3A; --ink-soft: #676A6F;
  --blue: #6575B0; --sky: #A2C18F; --accent: #F2C14E;
  --sez-salvia: color-mix(in srgb, var(--sky) 42%, var(--bg));
  --b: 3mm;   /* abbondanza */
  --m: 0mm;   /* margine per i crocini */
}
html.crocini { --m: 10mm; }
@page { size: calc(85mm + 2 * var(--b) + 2 * var(--m)) calc(55mm + 2 * var(--b) + 2 * var(--m)); margin: 0; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body { margin: 0; background: #fff; }
body { color: var(--ink); font-family: 'Instrument Sans', sans-serif; }

.sheet { clip-path: inset(0); position: relative; overflow: hidden; break-after: page;
  width: calc(85mm + 2 * var(--b) + 2 * var(--m)); height: calc(55mm + 2 * var(--b) + 2 * var(--m)); }
.sheet:last-child { break-after: auto; }
.bleed { clip-path: inset(0); position: absolute; left: var(--m); top: var(--m); overflow: hidden;
  width: calc(85mm + 2 * var(--b)); height: calc(55mm + 2 * var(--b)); }
.marks { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
html.crocini .marks { display: block; }

/* il biglietto, in mm reali, posato dentro l'abbondanza: gli sfondi e i cerchi continuano oltre il taglio */
.card { position: absolute; left: var(--b); top: var(--b); width: 85mm; height: 55mm; overflow: visible;
  font-size: 2.6mm; line-height: 1.35; }
.ivory { background: var(--bg); } .white { background: #fff; } .sage { background: var(--sez-salvia); }

.name { font-weight: 700; font-size: 4.1mm; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
.role { font-size: 2.6mm; margin: .8mm 0 0; color: var(--ink-soft); }
.contacts { list-style: none; padding: 0; margin: 0; display: grid; gap: 1mm; font-size: 2.45mm; }
.contacts li { display: flex; align-items: center; gap: 1.8mm; }
.contacts svg { width: 2.8mm; height: 2.8mm; flex: none; stroke: var(--blue); }
/* sottolineato giallo "a mano" in vettoriale (lo sfondo CSS verrebbe rasterizzato nel PDF) */
/* evidenziatore: un rettangolo pieno dietro al testo, resta vettoriale nel PDF */
mark.y { color: inherit; background: none; position: relative; z-index: 0; padding: 0 .1em; }
mark.y::before { content: ""; position: absolute; z-index: -1; left: 0; right: 0; top: 58%; bottom: 8%; background: #F9E3AF; }

.rings { position: absolute; border-radius: 50%; --gap: 2.4mm; --line: .28mm; filter: url(#mano);
  background: repeating-radial-gradient(circle closest-side, transparent 0 calc(var(--gap) - var(--line)), var(--ring) calc(var(--gap) - var(--line)) var(--gap)); }

/* ===== C ===== */
.c-front { padding: 8mm 7mm; display: flex; flex-direction: column; justify-content: flex-start; }
.c-front .quote { font-size: 4mm; font-weight: 700; letter-spacing: -.025em; line-height: 1.18; margin: 0; max-width: 56mm; position: relative; }
.c-front .quote em { color: var(--blue); }
.c-front .rings { --ring: color-mix(in srgb, var(--blue) 40%, transparent); width: 60mm; height: 60mm; right: -24mm; bottom: -30mm; }
.c-front .sign { position: absolute; left: 7mm; bottom: 6mm; display: flex; align-items: center; gap: 2mm; font-size: 2.3mm; color: var(--ink-soft); }
.c-front .sign img { width: 4.2mm; }
.c-back { padding: 6.5mm 7mm; display: flex; flex-direction: column; justify-content: space-between; }
.c-back .contacts { margin-bottom: 1mm; }
.c-back header { display: flex; align-items: center; gap: 3mm; }
.c-back header img { width: 16mm; }

/* ===== D ===== */
.d-front { display: grid; grid-template-columns: 1fr 1fr; }
/* metà pervinca che arriva fino al bordo dell'abbondanza */
.bleed.d-split { background: linear-gradient(90deg, var(--blue) 0 calc(var(--b) + 42.5mm), #fff calc(var(--b) + 42.5mm)); }
.d-front .l { display: grid; place-items: center; }
.d-front .l img { width: 30mm; }
.d-front .r { padding: 6mm 5mm; display: flex; flex-direction: column; justify-content: center; gap: 1mm; }
.d-front .r .name { font-size: 3.6mm; }
.d-front .r .role { font-size: 2.3mm; }
.d-back { padding: 6mm 7mm; display: grid; grid-template-columns: 1fr 19mm; gap: 5mm; align-items: center; }
.d-back .qr { width: 19mm; height: 19mm; display: grid; }
.d-back .qr svg { width: 100%; height: 100%; }
.d-back .cta { font-size: 2.2mm; color: var(--ink-soft); text-align: center; margin: 1mm 0 0; }
.d-back .col { display: grid; gap: 3mm; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="mano"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="8"/></filter>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
</svg>

<template id="contatti">
  <ul class="contacts">
    <li><svg><use href="#i-phone"/></svg>345 267 1279</li>
    <li><svg><use href="#i-mail"/></svg>riccobonogaia.psi@gmail.com</li>
    <li><svg><use href="#i-pin"/></svg>Piazza Stazione 3, Lecco</li>
    <li><svg><use href="#i-web"/></svg>gaiariccobono.it</li>
  </ul>
</template>

<!-- Proposta C · fronte -->
<div class="sheet" data-p="c"><div class="bleed sage">
  <div class="card c-front"><span class="rings"></span>
    <p class="quote">Uno spazio dove essere ascoltati e dove <em>la tua storia</em> può prendere nuove strade.</p>
    <span class="sign"><img src="../img/icona.svg" alt="">gaiariccobono.it</span>
  </div></div></div>

<!-- Proposta C · retro -->
<div class="sheet" data-p="c"><div class="bleed ivory">
  <div class="card c-back">
    <header><img src="../img/logo.svg" alt=""><div><p class="name">Dott.ssa Gaia Riccobono</p><p class="role">Psicologa</p></div></header>
    <div data-contatti></div>
  </div></div></div>

<!-- Proposta D · fronte -->
<div class="sheet" data-p="d"><div class="bleed d-split">
  <div class="card d-front">
    <div class="l"><img src="../img/logo-chiaro.svg" alt=""></div>
    <div class="r"><p class="name">Dott.ssa Gaia Riccobono</p><p class="role">Psicologa<br>Lecco e online</p></div>
  </div></div></div>

<!-- Proposta D · retro -->
<div class="sheet" data-p="d"><div class="bleed white">
  <div class="card d-back">
    <div class="col"><div data-contatti></div></div>
    <div><div class="qr"></div><p class="cta">Prenota un<br><mark class="y">primo colloquio</mark></p></div>
  </div></div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="qr.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('crocini')) document.documentElement.classList.add('crocini');
  if (q.get('p')) document.querySelectorAll('.sheet').forEach(s => { if (s.dataset.p !== q.get('p')) s.remove(); });

  const t = document.getElementById('contatti');
  document.querySelectorAll('[data-contatti]').forEach(el => el.replaceWith(t.content.cloneNode(true)));

  const svg = qrBiglietto('https://gaiariccobono.it/');
  document.querySelectorAll('.qr').forEach(el => el.innerHTML = svg);

  /* crocini: linee sul filo del taglio, fuori dall'abbondanza (margine 10 mm, abbondanza 3 mm) */
  if (q.has('crocini')) {
    const W = 111, H = 81, m = 10, b = 3, x1 = m + b, x2 = W - m - b, y1 = m + b, y2 = H - m - b, s = 2, e = m - 1;
    const l = (a, c, d, f) => `<line x1="${a}" y1="${c}" x2="${d}" y2="${f}"/>`;
    const lines = [
      l(s, y1, e, y1), l(s, y2, e, y2), l(W - s, y1, W - e, y1), l(W - s, y2, W - e, y2),
      l(x1, s, x1, e), l(x2, s, x2, e), l(x1, H - s, x1, H - e), l(x2, H - s, x2, H - e)
    ].join('');
    document.querySelectorAll('.sheet').forEach(sh => sh.insertAdjacentHTML('beforeend',
      `<svg class="marks" viewBox="0 0 ${W} ${H}" stroke="#000" stroke-width="0.1">${lines}</svg>`));
  }
</script>
</body>
</html>
